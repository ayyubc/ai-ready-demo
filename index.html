      '<td>' + m.passed.length + ' of ' + m.tested.length + '</td><td><span class="st ' + statusClass(m.status) + '">' + esc(m.status) + '</span></td></tr>';
  }).join('');
  return '<div class="stats"><div class="stat dark"><div class="v" id="stCands">' + cands.length + '</div><div class="l">Candidates</div></div><div class="stat"><div class="v" id="stAvg">' + avg + '%</div><div class="l">Average readiness</div></div>' +
    '<div class="stat"><div class="v" id="stReady">' + ready + '</div><div class="l">Ready to start</div></div><div class="stat"><div class="v" id="stReview">' + review + '</div><div class="l">Needs review</div></div></div>' +
    '<div class="card"><h2>Candidates</h2><p class="muted small">Eight fictional sample candidates and the live demo candidate. Select a name for detail.</p><div class="scroll"><table id="candTable"><thead><tr><th>Name</th><th>Role</th><th>Start date</th><th>Readiness</th><th>Passed</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}
function answerLabel(q, v) {
  const opt = x => optLabel(q.key, x);
  if (Array.isArray(v)) return v.map(opt).join(', ') || 'No answer';
  if (v === undefined || v === null || v === '') return 'Not answered';
  return opt(v);
}
const GROUP_LABEL = { priority: 'Priority', required: 'Required', testout: 'Test out', optional: 'Optional' };
const GROUP_CLASS = { priority: 'prio', required: '', testout: 'go', optional: '' };
function groupTag(g, course) { return '<span class="tag ' + GROUP_CLASS[g] + '" data-group="' + g + '">' + (course && g === 'testout' ? 'Skip, already experienced' : GROUP_LABEL[g]) + '</span>'; }
function hrDetail() {
  const c = candByKey(ui.hr.cand); if (!c) return hrDashboard();
  const m = metrics(c);
  const itemOf = {}; m.path.items.forEach(it => { itemOf[it.id] = it; });
  let rows = '';
  const groupBtn = (id, g) => '<button type="button" class="btn sm ghost" data-act="hr-group" data-key="' + c.key + '" data-id="' + id + '" aria-label="' + (g === 'optional' ? 'Make ' + id + ' required' : 'Make ' + id + ' optional') + '">' + (g === 'optional' ? 'Make required' : 'Make optional') + '</button>';
  if (!c.role) rows = '<tr><td colspan="5">This candidate has not completed the intake, so no path is assigned yet.</td></tr>';
  else {
    rows = MODULES.map(mod => {
      const id = mod.id; const p = c.prog[id] || {}; const it = itemOf[id]; const on = !!it; const locked = c.ov.lock.includes(id);
      let status, cls = 'dim';
      if (!on) status = 'Not assigned';
      else if (p.passed) { status = 'Passed'; cls = 'ready'; }
      else if (locked) { status = 'Locked by HR'; cls = 'review'; }
      else if ((p.attempts || 0) >= 2) { status = 'HR review'; cls = 'review'; }
      else if ((p.attempts || 0) === 1) { status = 'In progress'; cls = 'atrisk'; }
      else { status = 'Not started'; cls = 'ontrack'; }
      const fixed = id === 'M1' || id === 'M15';
      let acts = '';
      acts += fixed ? '<span class="muted small">Required</span>' : '<button type="button" class="btn sm ' + (on ? 'ghost' : '') + '" data-act="hr-assign" data-key="' + c.key + '" data-id="' + id + '" aria-label="' + (on ? 'Unassign ' : 'Assign ') + id + '">' + (on ? 'Unassign' : 'Assign') + '</button>';
      if (on && !fixed) acts += groupBtn(id, it.group);
      acts += '<button type="button" class="btn sm ghost" data-act="hr-lock" data-key="' + c.key + '" data-id="' + id + '"' + (on ? '' : ' disabled') + ' aria-label="' + (locked ? 'Unlock ' : 'Lock ') + id + '">' + (locked ? 'Unlock' : 'Lock') + '</button>';
      if (c.live && on && (p.attempts || 0) >= 2 && !p.passed) acts += '<button type="button" class="btn sm dark" data-act="hr-retry" data-id="' + id + '">Allow retry</button>';
      return '<tr data-row="' + id + '"><td><strong>' + id + '</strong> ' + esc(mod.title) + (on ? ' ' + groupTag(it.group) : '') + (on && it.reason ? '<div class="reason">' + esc(it.reason) + '</div>' : '') + '</td><td><span class="st ' + cls + '">' + status + '</span></td><td>' + (on && p.passed ? p.score + '%' : '-') + '</td><td>' + (on ? (p.attempts || 0) : '-') + '</td><td><div class="acts">' + acts + '</div></td></tr>';
    }).join('');
    if (c.role === 'engineer') rows += ENGINEER_COURSES.map((name, i) => {
      const id = 'C' + (i + 1); const it = itemOf[id]; const p = c.prog[id] || {};
      if (!it) return '<tr data-row="' + id + '"><td><strong>' + id + '</strong> ' + esc(name) + '</td><td><span class="st dim">Not listed</span></td><td>-</td><td>-</td><td><span class="muted small">Not listed for this candidate</span></td></tr>';
      const st = it.group === 'testout' ? ['Skip, already experienced', 'ready'] : p.studied ? ['Completed', 'ready'] : it.group === 'optional' ? ['Optional', 'dim'] : ['Course to take', 'ontrack'];
      return '<tr data-row="' + id + '"><td><strong>' + id + '</strong> ' + esc(name) + ' ' + groupTag(it.group, true) + (it.reason ? '<div class="reason">' + esc(it.reason) + '</div>' : '') + '</td><td><span class="st ' + st[1] + '">' + st[0] + '</span></td><td>-</td><td>-</td><td><div class="acts">' + groupBtn(id, it.group) + '</div></td></tr>';
    }).join('');
  }
  const asked = visibleQuestions(c.ans || {});
  const qa = asked.map(q => '<dt>' + esc(q.prompt) + '</dt><dd>' + esc(answerLabel(q, c.ans ? c.ans[q.key] : undefined)) + '</dd>').join('');
  const flags = m.path.flags.map(f => '<div class="flagbox" data-flag="1"><strong>Flag:</strong> ' + esc(f) + '</div>').join('');
  return '<button type="button" class="back" data-act="hr-tab" data-tab="dashboard">' + ico('back', 18) + ' All candidates</button>' +
    '<div class="row between"><div><h2 class="m0" id="detailName">' + esc(c.name) + (c.live ? ' (live candidate)' : '') + '</h2><p class="muted">' + esc(c.role ? ROLES[c.role].label : 'Intake pending') + ', starting ' + esc(fmtDate(c.start)) + '</p></div><span class="st ' + statusClass(m.status) + '" id="detailStatus">' + esc(m.status) + '</span></div>' +
    (c.live ? '<p class="muted small">Changes here show up in the Candidate path straight away.</p>' : '') +
    (c.role ? personaCard(m.path, false, flags + m.path.notes.map(n => '<p class="muted small m0">' + esc(n) + '</p>').join('')) : '') +
    '<div class="card"><h3>Modules</h3><p class="muted small">Required, priority and test-out modules count toward readiness and the credential. Optional ones never do.</p><div class="scroll"><table id="modTable"><thead><tr><th>Module</th><th>Status</th><th>Score</th><th>Attempts</th><th>Actions</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>' +
    '<div class="card"><h3>Questionnaire answers</h3>' + (c.ans && Object.keys(c.ans).length ? '<p class="muted small">Only the questions this candidate was asked.</p><dl class="qa">' + qa + '</dl>' : '<p class="muted">No answers yet.</p>') + '</div>';
}
function hrRoles() {
  const role = ui.hr.role;
  const pick = '<div class="rolepick" role="group" aria-label="Role">' + Object.keys(ROLES).map(k => '<button type="button" class="btn sm ' + (k === role ? 'dark' : 'ghost') + '" data-act="hr-role" data-role="' + k + '" aria-pressed="' + (k === role) + '">' + esc(ROLES[k].label) + '</button>').join('') + '</div>';
  let body;
  if (role === 'engineer') {
    body = '<div class="card"><h3>Software engineer</h3><p>The engineer path uses M1, M7 and M8, then the courses below that match the candidate&#39;s answers (no test), then the M15 capstone. There is no 12-skill map for engineers in this pilot.</p><ul>' + ENGINEER_COURSES.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>';
  } else {
    const edits = S.roleMaps[role] || {};
    body = '<div class="card"><div class="row between"><h3 class="m0">' + esc(ROLES[role].label) + ': 12 skills</h3><button type="button" class="btn sm ghost" data-act="hr-restore">Restore defaults</button></div><p class="muted small">Edit any skill. Changes save in this browser.</p>' +
      ROLE_MAPS[role].map((r, i) => '<div class="skill"><div><label class="sr" for="sk' + i + '">Skill ' + (i + 1) + '</label><input id="sk' + i + '" class="input" data-rm="' + role + '" data-i="' + i + '" value="' + esc(edits[i] !== undefined ? edits[i] : r[0]) + '"></div><div class="mchips">' + r[1].split(',').map(x => '<span class="chip" title="' + esc(MOD[x].title) + '">' + x + '</span>').join('') + '</div></div>').join('') + '</div>';
  }
  return pick + body;
}
function hrModules() {
  const cards = MODULES.map(m => '<div class="card"><div class="row between"><h3 class="m0">' + m.id + ' ' + esc(m.title) + '</h3><span class="chip">' + esc(m.aud) + '</span></div>' +
    '<p class="small"><strong>Existing material.</strong> ' + (m.builds ? 'Builds on ' + esc(m.builds) + '.' : m.material.map(x => esc(x.t)).join('; ') + '.') + '</p>' +
    '<p class="small m0"><strong>Test.</strong> ' + esc(m.test) + '</p></div>').join('');
  return '<div class="modgrid">' + cards + '<div class="card"><h3>Engineer course track</h3><p class="small">Existing courses, no test in the demo. Each engineer sees only the courses that match their intake answers (required, priority, skip or optional), plus M1, M7, M8 and M15.</p><ol class="small">' + ENGINEER_COURSES.map(x => '<li>' + esc(x) + '</li>').join('') + '</ol></div></div>';
}

/* ---------- HR / credential actions ---------- */
function toggleAssign(key, id) {
  const c = candByKey(key); if (!c || !c.role || id === 'M1' || id === 'M15') return;
  const ov = c.ov; const inBase = basePathIds(c).indexOf(id) >= 0;
  const on = candPath(c).ids.indexOf(id) >= 0;
  const rm = a => { const i = a.indexOf(id); if (i >= 0) a.splice(i, 1); };
  if (on) { rm(ov.add); if (inBase && ov.remove.indexOf(id) < 0) ov.remove.push(id); rm(ov.lock); }
  else { rm(ov.remove); if (!inBase && ov.add.indexOf(id) < 0) ov.add.push(id); }
  save(); render();
  toast((on ? 'Unassigned ' : 'Assigned ') + id + (c.live ? '. The candidate path is updated.' : ''));
}
function toggleLock(key, id) {
  const c = candByKey(key); if (!c) return;
  const ov = c.ov; const i = ov.lock.indexOf(id);
  if (i >= 0) ov.lock.splice(i, 1); else ov.lock.push(id);
  save(); render();
  toast((i >= 0 ? 'Unlocked ' : 'Locked ') + id + (c.live ? '. The candidate path is updated.' : ''));
}
/* HR: "Make required" on an optional module, "Make optional" on any other. Stored as an override that is dropped when it matches the rules' own result. */
function toggleGroup(key, id) {
  const c = candByKey(key); if (!c || !c.role || id === 'M1' || id === 'M15') return;
  const it = candPath(c).items.find(x => x.id === id); if (!it) return;
  const target = it.group === 'optional' ? 'required' : 'optional';
  const baseG = baseGroup(c, id);
  if (baseG && (target === 'optional') === (baseG === 'optional')) delete c.ov.group[id]; else c.ov.group[id] = target;
  save(); render();
  toast(id + ' is now ' + target + '.' + (c.live ? ' The candidate path is updated.' : ''));
}
function retakeIntake() {
  S.intake = { done: false, ans: {} }; S.prog = {}; S.xp = 0; S.days = []; S.cred = null; S.migrated = false;
  delete S.hr.live; save();
  ui.cand = { screen: 'welcome', qk: null, mod: null, draft: {}, result: null, nameErr: '' }; ui.busy = false;
  closeDialog();
  if (route() !== 'candidate') location.hash = '#candidate'; else render({ top: true });
  toast('Intake cleared. Answer the questions again to build a new path.');
}
function passAll() {
  ui.menu = false;
  const c = liveCand();
  if (!c.role) { render(); toast('Finish the intake first, so your path is known.'); return; }
  const m = metrics(c);
  m.tested.forEach((id, i) => {
    const p = prog(id);
    if (!p.passed) {
      const sc = 80 + ((i * 4 + id.length) % 15);
      p.passed = true; p.score = sc; p.date = todayStr(); p.attempts = Math.max(1, Math.min(p.attempts || 1, 2)); p.hrReview = false; p.studied = true;
      p.last = { demo: true, mode: 'offline', pct: sc, pass: true, xp: xpFor(sc), criteria: [], feedback: '' };
      S.xp += xpFor(sc);
    }
  });
  markDay(); syncCredential(); save();
  toast('All modules passed. Credential issued.');
  if (route() === 'credential') render({ top: true }); else location.hash = '#credential';
}
function resetDemo() {
  storeClear(); S = defaultState();
  ui.cand = { screen: 'welcome', qk: null, mod: null, draft: {}, result: null, nameErr: '' };
  ui.hr = { tab: 'dashboard', cand: null, role: 'finance' }; ui.verify = null; ui.menu = false;
  SAMPLES.forEach(s => { SAMPLE_PROG[s.key] = sampleProg(s); });
  closeDialog();
  if (route() !== 'candidate') location.hash = '#candidate'; else render({ top: true });
  toast('Demo reset to the starting state.');
}

/* =====================================================================
   EVENTS + BOOT
   ===================================================================== */
const ACTIONS = {
  'menu': () => { ui.menu = !ui.menu; renderNav(); },
  'reset-ask': () => { ui.menu = false; renderNav(); openDialog('Reset the demo?', 'This clears the live candidate, HR changes and saved role map edits, and returns to the welcome screen.', [{ label: 'Cancel', act: 'dlg-close', kind: 'ghost' }, { label: 'Reset demo', act: 'reset-do', kind: 'coral' }]); },
  'reset-do': () => resetDemo(),
  'dlg-close': () => closeDialog(),
  'pass-all': () => passAll(),
  'home': () => goCand('home'),
  'show-summary': () => goCand('summary'),
  'edit-intake': () => goCand('welcome'),
  'pick': t => pickAnswer(t),
  'q-next': () => nextQuestion(),
  'q-back': () => backQuestion(),
  'open-mod': t => openModule(t.getAttribute('data-id')),
  'open-course': t => goCand('course', { mod: t.getAttribute('data-id') }),
  'studied': () => { const p = prog(ui.cand.mod); p.studied = !p.studied; save(); render(); toast(p.studied ? 'Marked as studied.' : 'Study mark removed.'); },
  'start-test': () => startTest(),
  'sample-fill': () => {
    const mod = MOD[ui.cand.mod]; ui.cand.draft[mod.id] = mod.sample;
    const ta = document.getElementById('answer'); if (ta) ta.value = mod.sample;
    updateWc(); const e = document.getElementById('testErr'); if (e) e.textContent = '';
  },
  'submit': () => submitAnswer(),
  'retry': () => goCand('test'),
  'result-view': () => goCand('result'),
  'hr-tab': t => { ui.hr.tab = t.getAttribute('data-tab'); render({ top: true }); },
  'hr-open': t => { ui.hr.cand = t.getAttribute('data-key'); ui.hr.tab = 'detail'; render({ top: true }); },
  'hr-assign': t => toggleAssign(t.getAttribute('data-key'), t.getAttribute('data-id')),
  'hr-lock': t => toggleLock(t.getAttribute('data-key'), t.getAttribute('data-id')),
  'hr-retry': t => { const p = prog(t.getAttribute('data-id')); p.attempts = 1; p.hrReview = false; save(); render(); toast('One more attempt allowed.'); },
  'hr-role': t => { ui.hr.role = t.getAttribute('data-role'); render(); },
  'course-done': () => { const p = prog(ui.cand.mod); p.studied = !p.studied; save(); render(); toast(p.studied ? 'Course marked as completed.' : 'Completed mark removed.'); },
  'hr-group': t => toggleGroup(t.getAttribute('data-key'), t.getAttribute('data-id')),
  'retake-ask': () => { ui.menu = false; renderNav(); openDialog('Retake the intake?', 'This clears your answers, your path and your test results so you can start the questions again. Your name is kept.', [{ label: 'Cancel', act: 'dlg-close', kind: 'ghost' }, { label: 'Retake intake', act: 'retake-do', kind: 'coral' }]); },
  'retake-do': () => retakeIntake(),
  'hr-restore': () => { delete S.roleMaps[ui.hr.role]; save(); render(); toast('Role map restored to defaults.'); }
};
function updateWc() {
  const ta = document.getElementById('answer'); const n = document.getElementById('wcN'); if (!ta || !n) return;
  const w = wordCount(ta.value); n.textContent = w + ' words'; n.className = w >= 40 ? 'ok' : '';
}
document.addEventListener('click', e => {
  const t = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!t) {
    if (ui.menu && !e.target.closest('#menuwrap')) { ui.menu = false; renderNav(); }
    return;
  }
  const act = t.getAttribute('data-act');
  if (act === 'dlg-scrim') { if (e.target === t) closeDialog(); return; }
  if (t.disabled || t.getAttribute('aria-disabled') === 'true') return;
  if (act !== 'menu' && ui.menu) { ui.menu = false; renderNav(); }
  const fn = ACTIONS[act]; if (fn) fn(t, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'answer') { ui.cand.draft[ui.cand.mod] = t.value; updateWc(); }
  else if (t.getAttribute && t.getAttribute('data-rm')) {
    const role = t.getAttribute('data-rm'); const i = t.getAttribute('data-i');
    if (!S.roleMaps[role]) S.roleMaps[role] = {};
    S.roleMaps[role][i] = t.value; save();
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'nameForm') startNameForm();
  else if (f.id === 'verifyForm') {
    const q = document.getElementById('verifyId').value;
    ui.verify = { q, res: lookupCred(q) || null };
    render();
    const r = document.getElementById('verifyResult'); if (r && r.scrollIntoView) r.scrollIntoView({ block: 'nearest' });
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('overlay').firstChild) closeDialog();
    else if (ui.menu) { ui.menu = false; renderNav(); const b = document.getElementById('menuBtn'); if (b) b.focus(); }
  }
});
window.addEventListener('hashchange', () => { ui.menu = false; render({ top: true }); });

(function boot() {
  initUI();
  if (!location.hash || ROUTES.indexOf(location.hash.replace(/^#/, '')) < 0) {
    try { history.replaceState(null, '', location.pathname + location.search + '#candidate'); } catch (e) { location.hash = '#candidate'; }
  }
  render({ top: true });
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}</script>
